<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHUNXI.fun - 部署工具</title>
<meta name="description" content="CHUNXI科技部署工具 - 蛋仔CHUNXI科技团队 · 春熙医疗团队开发">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #ede9fe 100%);
    color: #0f172a;
    padding-bottom: 40px;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 40px 20px; }
  header { text-align: center; margin-bottom: 36px; }
  .logo {
    width: 68px; height: 68px; border-radius: 20px;
    background: linear-gradient(135deg, #22d3ee, #8b5cf6);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 34px; margin-bottom: 16px;
    box-shadow: 0 14px 36px rgba(124,58,237,0.22);
  }
  h1 { font-size: 28px; font-weight: 800; }
  .sub { color: #475569; font-size: 14px; margin-top: 6px; }
  .card {
    background: rgba(255,255,255,0.94);
    border: 1px solid rgba(186,230,253,0.85);
    border-radius: 24px;
    padding: 26px;
    margin-bottom: 22px;
    box-shadow: 0 20px 60px rgba(14,116,144,0.10);
  }
  .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; }
  .link-btn {
    flex: 1; min-width: 140px; padding: 14px; border-radius: 14px;
    background: linear-gradient(90deg, #0284c7, #7c3aed); color: #fff;
    text-decoration: none; font-weight: 700; text-align: center;
    transition: transform .2s, box-shadow .2s;
    border: none; cursor: pointer; font-size: 15px;
  }
  .link-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(2,132,199,0.22); }
  .link-btn.secondary { background: #fff; color: #0369a1; border: 1px solid #bae6fd; }
  textarea {
    width: 100%; min-height: 180px; border-radius: 14px;
    border: 1px solid #e2e8f0; padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; resize: vertical; outline: none;
  }
  textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.12); }
  input[type=text] {
    width: 100%; height: 46px; border-radius: 12px;
    border: 1px solid #e2e8f0; padding: 0 14px;
    margin-top: 12px; outline: none; font-size: 14px;
  }
  input[type=text]:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.12); }
  .btn {
    width: 100%; height: 46px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #0284c7, #7c3aed); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px;
    transition: opacity .2s;
  }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .result {
    margin-top: 16px; word-break: break-all; font-size: 13px;
    background: #f0f9ff; border-radius: 12px; padding: 12px;
    display: none; line-height: 1.6;
  }
  .result.error { color: #ef4444; background: #fef2f2; }
  .result a { color: #0284c7; font-weight: 600; }
  .tip { font-size: 12px; color: #64748b; margin-top: 10px; line-height: 1.6; }
  footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🚀</div>
      <h1>CHUNXI.fun</h1>
      <p class="sub">CHUNXI科技部署工具 · 蛋仔CHUNXI科技团队 · 春熙医疗团队开发</p>
    </header>

    <div class="card">
      <h2>🔗 我的应用</h2>
      <div class="links">
        <a class="link-btn" href="./ai.html">哈利猫 AI</a>
        <a class="link-btn secondary" href="./admin.html">后台管理</a>
      </div>
      <p class="tip">以上两个链接通过 GitHub Pages 长期部署，长期有效。</p>
    </div>

    <div class="card">
      <h2>🚀 手动部署（临时链接）</h2>
      <p class="tip">把 HTML 代码粘贴到下面，点击「开始部署」即可获得一个 72 小时有效的分享链接。</p>
      <textarea id="htmlInput" placeholder="<!DOCTYPE html>..."></textarea>
      <input type="text" id="titleInput" placeholder="标题（可选）">
      <button class="btn" id="deployBtn">开始部署</button>
      <div class="result" id="result"></div>
    </div>

    <div class="card">
      <h2>📦 GitHub Pages 永久部署</h2>
      <p class="tip">如需把页面长期部署到 GitHub Pages，直接把 HTML 代码发给我，我可以帮你更新到仓库。</p>
    </div>

    <footer>© 2026 CHUNXI 科技 · 春熙医疗团队</footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    $('deployBtn').addEventListener('click', async () => {
      const html = $('htmlInput').value.trim();
      if (!html) { showResult('请先粘贴 HTML 代码', true); return; }
      const btn = $('deployBtn');
      btn.disabled = true;
      btn.textContent = '部署中…';
      try {
        const form = new FormData();
        form.append('reqtype', 'fileupload');
        form.append('time', '72h');
        const blob = new Blob([html], { type: 'text/html' });
        form.append('fileToUpload', blob, 'index.html');
        const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', { method: 'POST', body: form });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const url = (await res.text()).trim();
        if (!url.startsWith('https://')) throw new Error(url || '上传失败');
        showResult('部署成功（72 小时有效）：<br><a href="' + url + '" target="_blank">' + url + '</a>', false);
      } catch (e) {
        const msg = e.message || '';
        if (msg.includes('CORS') || msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
          showResult('部署失败：浏览器无法直接访问 Litterbox API（CORS 限制）。<br>请把 HTML 代码复制给我，我帮你部署。', true);
        } else {
          showResult('部署失败：' + msg + '<br>请把 HTML 代码复制给我，我帮你部署。', true);
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '开始部署';
      }
    });
    function showResult(msg, isError) {
      const el = $('result');
      el.innerHTML = msg;
      el.className = 'result' + (isError ? ' error' : '');
      el.style.display = 'block';
    }
  </script>
</body>
</html>
